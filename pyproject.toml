[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blender-quality-lab"
version = "0.2.0"
description = "Blender scene recipes, vision-free scene inspection with technical gates and fixes, and honest evaluation tooling."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Alejandro Brito"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
blender-quality = "blender_quality.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_quality"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Blender integration tests are opt-in: `python -m pytest -m blender` (skipped if Blender is absent).
addopts = ["-m", "not blender"]
markers = ["blender: needs a real Blender executable (builds, sabotages and inspects scenes)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

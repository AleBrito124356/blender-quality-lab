[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blender-quality-lab"
version = "0.1.0"
description = "Reproducible Blender scene recipes, technical audits and honest human quality evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Alejandro Brito"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
blender-quality = "blender_quality.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_quality"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    name: Lint, offline tests and build (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests examples
      - run: python -m ruff format --check src tests examples
      # Blender integration tests are opt-in (-m blender); these run on recorded Blender fixtures.
      - run: python -m pytest -q
      - run: python -m build

  blender:
    # Blender's bpy module from PyPI: no Blender download and no API credits.
    name: Blender integration (bpy ${{ matrix.bpy }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.13', bpy: '5.2.3'}
          - {python: '3.11', bpy: '4.5.*'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: X11/GL client libraries that bpy links against, and Mesa EGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libx11-6 libxext6 libxfixes3 libxi6 libxrender1 libxxf86vm1 libxkbcommon0 libsm6 libice6 \
            libgl1 libegl1 libegl-mesa0 libgl1-mesa-dri
      - run: python -m pip install "bpy==${{ matrix.bpy }}" -e ".[dev]"
      - name: Use this Python (with bpy) as Blender
        run: echo "BLENDER=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: python -m blender_quality doctor
      - run: python -m pytest -m blender -q
      - name: Build two recipe scenes for the action
        run: |
          python -m blender_quality build abstract --output ci-scenes/abstract
          python -m blender_quality build product --output ci-scenes/product
      - name: The repository's own action, on those scenes
        id: action
        uses: ./
        with:
          files: ci-scenes/**/*.blend
          python-version: ${{ matrix.python }}
          bpy-version: ${{ matrix.bpy }}
      - name: Action outputs
        run: |
          test "${{ steps.action.outputs.checked }}" = 2
          test "${{ steps.action.outputs.failed }}" = 0
          test -f "${{ steps.action.outputs.reports }}/ci-scenes/abstract/abstract.blend.quality/report.md"
